name: Deploy benchmark dashboard

# Deploys the custom benchmark dashboard page and its copy of Chart.js to
# gh-pages/dev/bench. Decoupled from the benchmark runs so it never races on
# data.js, since it touches only the files below. github-action-benchmark won't
# overwrite an existing index.html, so once deployed this custom page persists.

on:
  push:
    branches: [main]
    paths:
      - benchmark/dashboard/**
      - .github/workflows/deploy_dashboard.yml
  workflow_dispatch:

permissions:
  contents: write

# Own concurrency group — deliberately NOT shared with performance_profiling.yml.
# Sharing a group made the two workflows cancel each other: when a benchmark run
# holds the group and a dashboard change lands, GitHub cancels the pending deploy.
# A dedicated group keeps deploys from being cancelled; the rare race with a
# benchmark gh-pages push is handled by the fetch+retry loop below instead.
concurrency:
  group: deploy-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy dashboard to gh-pages/dev/bench
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Capture the dashboard from the triggering commit before switching
          # branches: `git checkout gh-pages` swaps the working tree to the orphan
          # branch (no benchmark/dashboard/), so reading from the object store via
          # `git show` is what survives it.
          files="index.html chart.umd.js chart.js-LICENSE.md"
          for file in $files; do
            git show "$GITHUB_SHA:benchmark/dashboard/$file" > "$RUNNER_TEMP/$file"
          done

          # Re-fetch and retry on push rejection. A benchmark run may push data.js
          # to gh-pages concurrently; rebasing onto the latest tip each attempt
          # lets our change apply cleanly (different files).
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
            mkdir -p dev/bench
            for file in $files; do
              cp "$RUNNER_TEMP/$file" "dev/bench/$file"
              git add "dev/bench/$file"
            done
            if git diff --cached --quiet -- dev/bench; then
              echo "Dashboard already up to date."
              exit 0
            fi
            git commit -m "Deploy benchmark dashboard"
            if git push origin gh-pages; then
              echo "Dashboard deployed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5); re-fetching and retrying..."
            sleep 3
          done
          echo "Failed to deploy dashboard after 5 attempts."
          exit 1
