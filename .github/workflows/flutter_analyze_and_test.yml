# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Analyze and Test

on:
  # No branch filter, so a pull request stacked on another branch is checked too.
  # Filtering on [main, main-wip] meant every pull request above the base of a
  # stack ran nothing at all.
  pull_request:
  push:
    branches: [main, main-wip]

jobs:
  analyze: # Separate job for analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2

      # The examples are excluded via analysis_options.yaml (analyzer.exclude) and
      # verified by the separate analyze_examples.yml workflow.
      - name: Install dependencies
        run: flutter pub get
        shell: bash
        working-directory: ./

      # Uses the width from analysis_options.yaml. The examples have their own
      # and are formatted by the analyze_examples.yml workflow.
      - name: Formatting check
        run: dart format --output=none --set-exit-if-changed lib test tool benchmark
        shell: bash
        working-directory: ./

      - name: Analyze (dart)
        run: dart analyze
        shell: bash
        working-directory: ./

      - name: Analyze (flutter)
        run: flutter analyze
        shell: bash
        working-directory: ./

      # The data-driven fixes in lib/fix_data ship to users, so a broken one is
      # only visible here.
      - name: Migration fixes
        run: dart fix --compare-to-golden test_fixes
        shell: bash
        working-directory: ./

  doc-snippets: # The code in the README and the guides, which flutter analyze cannot see
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2

      - name: Install dependencies
        run: flutter pub get
        shell: bash
        working-directory: ./

      # Generates the snippets into examples/doc_snippets and analyzes them, so
      # it cannot join the analyze_examples.yml matrix, which only runs analyze.
      - name: Compile the documentation snippets
        run: dart run tool/analyze_doc_snippets.dart
        shell: bash
        working-directory: ./

  test: # Separate job for tests with matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [
          'America/New_York',
          'Europe/London',
          'Asia/Tokyo',
          'Australia/Sydney',
          'Africa/Johannesburg',
          'UTC'
        ]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2

      - name: Install dependencies
        run: flutter pub get
        shell: bash
        working-directory: ./

      - name: Run tests (${{ matrix.timezone }})
        run: flutter test
        shell: bash
        working-directory: ./
        env:
          TZ: ${{ matrix.timezone }}