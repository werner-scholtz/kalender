name: Performance Benchmarks

on:
  push:
    branches: [main]
    # Only run when something that can move the numbers changes: the package, the
    # micro-benchmark, or the `examples/testing` frame-profiling harness. An
    # allowlist means new example folders and docs never trigger a run without
    # anyone maintaining an ignore list.
    paths:
      - 'lib/**'
      - 'benchmark/**'
      - 'examples/testing/**'
      - 'pubspec.yaml'
      - '.github/workflows/performance_profiling.yml'
  # PRs only run when labelled `profile` (see the job-level `if` below), so this
  # does not run for every PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required so github-action-benchmark can push results to gh-pages and comment
# on pull requests.
permissions:
  contents: write
  pull-requests: write

# One run at a time per ref, and a newer one replaces an older one. Merging a
# stack of pull requests pushes to main once per merge, so without this every
# intermediate commit is profiled for 17 minutes and publishes a data point that
# the next merge immediately supersedes. Cancelling also keeps two runs from
# pushing to the gh-pages data file at once.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Empty "web demo" rebuild commits change no files, so the path filter above
    # does not catch them. Skip those pushes here too.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'web demo')) ||
      contains(github.event.pull_request.labels.*.name, 'profile')
    runs-on: ubuntu-latest

    env:
      DISPLAY: :99

    steps:
      - uses: actions/checkout@v5
      # Pinned, unlike the analyze and test workflows. This job compares numbers
      # against the history stored on gh-pages, so an SDK that moves underneath it
      # shows up as a performance change that no commit here caused.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          sudo apt-get install -y xvfb
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev
          sudo apt-get install -y mesa-common-dev

      # --- Micro-benchmarks (pure Dart, low noise — the primary signal) --------
      - name: Get package dependencies
        run: flutter pub get

      - name: Run micro-benchmarks
        run: flutter test benchmark/micro_benchmark_test.dart

      # --- Frame profiling (flutter drive, higher noise — supplementary) -------
      - name: Get example dependencies
        working-directory: ./examples/testing
        run: flutter pub get

      - name: Start virtual display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3

      - name: Run frame profiling
        working-directory: ./examples/testing
        env:
          DISPLAY: :99
        run: |
          flutter drive \
            --driver=test_driver/perf_driver.dart \
            --target=integration_test/performance_profiling_test.dart \
            --profile \
            -d linux

      - name: Upload raw timelines
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: timelines-${{ github.run_number }}
          path: examples/testing/build/*.timeline.json
          retention-days: 30

      # `flutter pub get` rewrites analysis_options.yaml to exclude the build and
      # platform directories, here and in examples/testing. The publish steps below
      # switch to gh-pages, which carries neither file, and git refuses to switch
      # while they are modified. Every result this job produces sits in an ignored
      # build/ directory, so restoring the tracked files discards nothing.
      - name: Restore files the SDK rewrote
        run: git restore .

      # --- Publish to the dashboard at gh-pages/dev/bench ----------------------
      # A run is only cancelled while main moves under it if the cancellation
      # arrives in time. This covers the rest: results for a commit that is no
      # longer the tip are measured but not stored, so the dashboard carries one
      # point per stack rather than one per merge.
      - name: Check this commit is still the tip of main
        id: tip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "main is now $tip, so results for ${{ github.sha }} are not stored."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # Comment-only: fail-on-alert is false, so regressions are surfaced in a PR
      # comment but never block the build. Alert thresholds sit above the
      # measured noise floors (micro is far tighter than frame). On main we
      # persist (auto-push). On PRs we only compare and comment (save-data-file
      # false) so PR runs never mutate the stored history.
      - name: Store micro-benchmark results
        if: steps.tip.outputs.superseded != 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Kalender Micro-benchmarks
          tool: customSmallerIsBetter
          output-file-path: build/micro_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-always: true
          fail-on-alert: false
          alert-threshold: '125%'
          summary-always: true

      - name: Store frame profiling results
        if: steps.tip.outputs.superseded != 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Kalender Frame Profiling
          tool: customSmallerIsBetter
          output-file-path: examples/testing/build/frame_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          # Second invocation in this job: reuse the local gh-pages branch the
          # first step already fetched/updated. Without this the re-fetch is
          # rejected as non-fast-forward.
          skip-fetch-gh-pages: true
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-always: true
          fail-on-alert: false
          alert-threshold: '150%'
          summary-always: true
