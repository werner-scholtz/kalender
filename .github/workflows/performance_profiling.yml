name: Performance Benchmarks

on:
  push:
    branches: [main]
    # Only run when something that can move the numbers changes: the package, the
    # micro-benchmark, or the `examples/testing` frame-profiling harness. An
    # allowlist means new example folders and docs never trigger a run without
    # anyone maintaining an ignore list.
    paths:
      - 'lib/**'
      - 'benchmark/**'
      - '!benchmark/dashboard/**'
      - 'examples/testing/**'
      - 'pubspec.yaml'
      - '.fvmrc'
      - '.github/workflows/performance_profiling.yml'
  # PRs only run when labelled `profile` (see the job-level `if` below), so this
  # does not run for every PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Required to push results to refs/benchmarks/data and to comment on pull
# requests.
permissions:
  contents: write
  pull-requests: write

# One run at a time per ref, and a newer one replaces an older one. Merging a
# stack of pull requests pushes to main once per merge, so without this every
# intermediate commit is profiled for 17 minutes and publishes a data point that
# the next merge immediately supersedes. Cancelling also keeps two runs from
# pushing to refs/benchmarks/data at once.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'profile')
    runs-on: ubuntu-latest

    env:
      DISPLAY: :99

    steps:
      - uses: actions/checkout@v5
      # The dashboard compares against history, so a bump of .fvmrc shows up as
      # a step in the frame series that no package commit caused. Check the SDK
      # version of the runs on either side before reading a step as a regression.
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version-file: .fvmrc

      # GitHub runs this job on more than one CPU model, and the faster one moves
      # every series. The model is stored with each run.
      - name: Record the runner CPU
        run: |
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n1)
          echo "Runner CPU: $cpu"
          echo "RUNNER_CPU=$cpu" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          sudo apt-get install -y xvfb
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev
          sudo apt-get install -y mesa-common-dev

      - name: Get package dependencies
        run: flutter pub get

      - name: Run micro-benchmarks
        run: flutter test benchmark/micro_benchmark_test.dart

      - name: Get example dependencies
        working-directory: ./examples/testing
        run: flutter pub get

      - name: Start virtual display
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3

      - name: Run frame profiling
        working-directory: ./examples/testing
        env:
          DISPLAY: :99
        run: |
          flutter drive \
            --driver=test_driver/perf_driver.dart \
            --target=integration_test/performance_profiling_test.dart \
            --profile \
            -d linux

      - name: Upload raw timelines
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: timelines-${{ github.run_number }}
          path: examples/testing/build/*.timeline.json
          retention-days: 30

      # The history lives in data.json on refs/benchmarks/data, a ref outside
      # refs/heads so a plain clone does not download it. The fetch fails when the
      # ref is missing, so a run never starts an empty history.
      - name: Fetch stored results
        run: |
          git fetch --depth=1 origin refs/benchmarks/data
          mkdir -p build/benchmarks
          git show FETCH_HEAD:data.json > build/benchmarks/data.json
          echo "BENCHMARK_DATA_PARENT=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"

      # A run is only cancelled by a newer one if the cancellation arrives in
      # time. This covers the rest: results for a commit that a newer run of this
      # workflow on main replaces are measured but not stored, so the dashboard
      # carries one point per stack rather than one per merge. A later commit that
      # does not run this workflow leaves the results stored.
      - name: Check no newer run replaces this one
        id: tip
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newer=$(gh api "repos/${{ github.repository }}/actions/workflows/performance_profiling.yml/runs?branch=main&event=push&per_page=20" \
            --jq '[.workflow_runs[] | select(.id > ${{ github.run_id }})] | length')
          if [ "$newer" != "0" ]; then
            echo "A newer run on main replaces this one, so results for ${{ github.sha }} are not stored."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      # Comment-only: fail-on-alert is false, so regressions are surfaced in a PR
      # comment but never block the build. Alert thresholds sit above the
      # measured noise floors (micro is far tighter than frame). Both steps
      # compare against and add to the local data.json. Only a push to main
      # saves the result.
      - name: Compare micro-benchmark results
        if: steps.tip.outputs.superseded != 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Kalender Micro-benchmarks
          tool: customSmallerIsBetter
          output-file-path: build/micro_results.json
          external-data-json-path: build/benchmarks/data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-always: true
          fail-on-alert: false
          alert-threshold: '125%'
          summary-always: true

      - name: Compare frame profiling results
        if: steps.tip.outputs.superseded != 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Kalender Frame Profiling
          tool: customSmallerIsBetter
          output-file-path: examples/testing/build/frame_results.json
          external-data-json-path: build/benchmarks/data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-always: true
          fail-on-alert: false
          alert-threshold: '150%'
          summary-always: true

      # Adds the Flutter version and the CPU to this run's entries and pushes
      # data.json as a new commit on refs/benchmarks/data. site.yml publishes it
      # after this workflow finishes.
      - name: Save results
        if: steps.tip.outputs.superseded == 'false'
        run: |
          jq --arg sha "$GITHUB_SHA" --arg flutter "$(jq -r .flutter .fvmrc)" --arg cpu "$RUNNER_CPU" \
            '.entries |= map_values(map(if .commit.id == $sha then .flutter = $flutter | .cpu = $cpu else . end))' \
            build/benchmarks/data.json > "$RUNNER_TEMP/data.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w "$RUNNER_TEMP/data.json")
          tree=$(printf '100644 blob %s\tdata.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -p "$BENCHMARK_DATA_PARENT" -m "Results for $GITHUB_SHA")
          git push origin "$commit:refs/benchmarks/data"
