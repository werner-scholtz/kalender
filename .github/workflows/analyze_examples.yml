name: Analyze Examples

# Only run when something that could affect the example apps changes: the package
# they depend on, the examples themselves, the root pubspec, or this workflow.
on:
  # No branch filter, so a pull request stacked on another branch is checked too.
  pull_request:
    paths:
      - 'lib/**'
      - 'examples/**'
      - 'pubspec.yaml'
      - '.github/workflows/analyze_examples.yml'
  push:
    branches: [main, main-wip]
    paths:
      - 'lib/**'
      - 'examples/**'
      - 'pubspec.yaml'
      - '.github/workflows/analyze_examples.yml'

jobs:
  analyze-examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - example
          - advanced_example
          - recurrence
          - riverpod
          - ics
          - intl4x
          - material_ui
          - web_demo
          - testing
    steps:
      - uses: actions/checkout@v5

      # Each example runs on the Flutter its .fvmrc names, or the root one when it has none.
      - name: Read the Flutter version
        id: flutter
        shell: bash
        run: |
          file=examples/${{ matrix.example }}/.fvmrc
          [ -f "$file" ] || file=.fvmrc
          echo "version=$(jq -r .flutter "$file")" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        shell: bash
        working-directory: ./examples/${{ matrix.example }}

      - name: Analyze
        run: flutter analyze
        shell: bash
        working-directory: ./examples/${{ matrix.example }}

      # The testing harness runs via `flutter drive`, not `flutter test`, so it
      # has no unit test directory. Run tests only where one exists.
      - name: Test
        run: if [ -d test ]; then flutter test; else echo "no test directory, skipping"; fi
        shell: bash
        working-directory: ./examples/${{ matrix.example }}
