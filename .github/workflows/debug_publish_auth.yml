# Temporary. Determines whether `dart pub get` resolves with a pub.dev credential
# configured, where `flutter pub get` does not. Delete once publishing works.
name: Debug publish auth

on:
  workflow_dispatch:

jobs:
  probe:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: 'stable'

      - name: Credential is configured
        run: dart pub token list

      - name: A. dart pub get, credential present
        run: |
          if dart pub get; then echo "RESULT A: dart pub get SUCCEEDED"; else echo "RESULT A: dart pub get FAILED"; exit 1; fi

      - name: B. dart analyze, credential present
        if: always()
        run: |
          if dart analyze --no-fatal-warnings; then echo "RESULT B: dart analyze SUCCEEDED"; else echo "RESULT B: dart analyze FAILED"; fi

      - name: C. dart pub publish dry run, credential present
        if: always()
        run: |
          if dart pub publish --dry-run; then echo "RESULT C: dry run SUCCEEDED"; else echo "RESULT C: dry run FAILED"; fi

      - name: D. flutter pub get, credential present
        if: always()
        run: |
          if flutter pub get; then echo "RESULT D: flutter pub get SUCCEEDED"; else echo "RESULT D: flutter pub get FAILED (expected)"; fi
